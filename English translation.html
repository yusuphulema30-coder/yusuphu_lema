<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MtonyoFlow</title>
  <style>
    #lang-toggle {
      padding: 8px 16px;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #lang-toggle:hover {
      background-color: #005a9e;
    }
  </style>
</head>
<body>
  <!-- Toggle button -->
  <button id="lang-toggle">Switch to Swahili</button>

  <!-- Content placeholders -->
  <h1 id="title"></h1>
  <p id="description"></p>

  <script>
    // Dictionary of translations
    const translations = {
      en: {
        title: "Welcome to MtonyoFlow",
        description: "This platform helps Tanzanian SMEs manage cashflow efficiently."
      },
      sw: {
        title: "Karibu MtonyoFlow",
        description: "Jukwaa hili linasaidia SMEs za Tanzania kusimamia mtiririko wa fedha kwa ufanisi."
      }
    };

    // Load saved language from browser storage (if any)
    let currentLang = localStorage.getItem("lang") || "en";

    function updateContent() {
      document.getElementById("title").textContent = translations[currentLang].title;
      document.getElementById("description").textContent = translations[currentLang].description;
      document.getElementById("lang-toggle").textContent =
        currentLang === "en" ? "Switch to Swahili" : "Switch to English";
    }

    // Toggle language on button click
    document.getElementById("lang-toggle").addEventListener("click", () => {
      currentLang = currentLang === "en" ? "sw" : "en";
      localStorage.setItem("lang", currentLang); // remember choice
      updateContent();
    });

    // Initialize page content
    updateContent();
  </script>
    <!-- Hamburger Menu Handler -->
<script src="javaScript/hamburger-menu.js"></script>
</body>

</html>
